<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Vector Fiscal</title>
  <meta name="theme-color" content="#f4f6f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mi Vector Fiscal</h1>
    <p id="hoy"></p>
  </header>

  <main id="app"></main>

  <nav id="tabs">
    <button data-tab="pagos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Pagos</span></button>
    <button data-tab="ingresos"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>10% y 5%</span></button>
    <button data-tab="historial"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Historial</span></button>
    <button data-tab="resumen"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M9 13h6M9 17h6"/></svg><span>Resumen</span></button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Ajustes</span></button>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
